name: build-and-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build exe
        shell: cmd
        run: build.bat
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/MaintenanceGoblin.exe).Hash.ToLower()
          "$hash  MaintenanceGoblin.exe" | Set-Content -Encoding ascii dist/MaintenanceGoblin.exe.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaintenanceGoblin
          path: |
            dist/MaintenanceGoblin.exe
            dist/MaintenanceGoblin.exe.sha256

  attach-release:
    needs: build-win
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MaintenanceGoblin
          path: .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MaintenanceGoblin.exe
            MaintenanceGoblin.exe.sha256
